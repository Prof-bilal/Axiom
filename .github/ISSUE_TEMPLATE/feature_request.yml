name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or pain point first, before any solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Related phase (see docs/PHASES.md), if you know it
      placeholder: Phase 7, package management
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This doesn't need root for the UI or an AI agent, and works without cloud AI.
          required: true
