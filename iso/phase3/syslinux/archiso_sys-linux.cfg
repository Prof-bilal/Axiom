LABEL arch
TEXT HELP
Boot the Axiom OS live and installer on BIOS.
It allows you to install Axiom OS or perform system maintenance.
ENDTEXT
MENU LABEL Axiom OS live and installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Axiom OS live and installer on BIOS with speakup screen reader.
It allows you to install Axiom OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Axiom OS live and installer (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
