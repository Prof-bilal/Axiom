# Axiom Terminal — system default configuration for foot.
#
# Users override any of this in ~/.config/foot/foot.ini. Palette and type
# follow docs/DESKTOP_DESIGN.md (branding/theme/axiom/colors.toml).

[main]
font=JetBrains Mono:size=11.5
font-bold=JetBrains Mono:weight=bold:size=11.5
font-italic=JetBrains Mono:slant=italic:size=11.5
line-height=17px
pad=18x40 center
# Let the compositor's percentage size win exactly; padding absorbs the
# remainder instead of the window snapping to whole cells.
resize-by-cells=no
title=Axiom Terminal
locked-title=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[colors-dark]
# Solid: no transparency, like the rest of the desktop.
alpha=1.0
background=2a2b2e
foreground=e6e6e8
selection-foreground=e6e6e8
selection-background=4a4c50
urls=5aa9ff
cursor=2a2b2e e6e6e8
#        black  red    green  yellow blue   magenta cyan   white
regular0=222325
regular1=f2685e
regular2=7fd99a
regular3=ffb348
regular4=5aa9ff
regular5=c49bff
regular6=20d6d2
regular7=c7c9cc
bright0=4a4c50
bright1=ff8f84
bright2=9ee6b3
bright3=ffc978
bright4=8cc4ff
bright5=d9beff
bright6=37f0ea
bright7=e6e6e8

[colors-light]
# Used when the desktop asks for light mode (AXIOM_THEME=light). Same ANSI roles
# as dark; the prompt and warnings keep their meaning on white.
alpha=1.0
background=ffffff
foreground=14181b
selection-foreground=14181b
selection-background=d8dee2
urls=ff9418
cursor=ffffff ff9418
#        black  red    green  yellow blue   magenta cyan   white
regular0=14181b
regular1=c0392b
regular2=2e7d4f
regular3=b45f00
regular4=2f6fb0
regular5=7b4fb0
regular6=0f8f8c
regular7=5f6f74
bright0=5f6f74
bright1=e0533f
bright2=3fa068
bright3=d07a16
bright4=4a8bd0
bright5=9a6bd0
bright6=12a9a5
bright7=14181b

[csd]
# Axiom Terminal uses the compositor's server-side title bar (labwc, Axiom
# theme): app icon, "Axiom Terminal", and working minimize / maximize / close.
preferred=server
