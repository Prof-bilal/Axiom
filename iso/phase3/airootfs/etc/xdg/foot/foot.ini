# Axiom Terminal — system default configuration for foot.
#
# Users override any of this in ~/.config/foot/foot.ini. Palette and type
# follow docs/DESKTOP_DESIGN.md (branding/theme/axiom/colors.toml).

[main]
font=JetBrains Mono:size=11.5
font-bold=JetBrains Mono:weight=bold:size=11.5
font-italic=JetBrains Mono:slant=italic:size=11.5
line-height=17px
pad=18x14 center
# Let the compositor's percentage size win exactly; padding absorbs the
# remainder instead of the window snapping to whole cells.
resize-by-cells=no
title=Axiom Terminal
locked-title=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[colors-dark]
# Axiom glass: near-black with the wallpaper showing through. labwc has no
# blur yet, so opacity stays at 0.82 for readability (mockup is ~0.6).
alpha=0.82
background=05080a
foreground=ffffff
selection-foreground=ffffff
selection-background=126e70
urls=2ee6d6
cursor=05080a ffffff
#        black  red    green  yellow blue   magenta cyan   white
regular0=11191d
regular1=d9534f
regular2=5cb85c
regular3=e8b04b
regular4=4a8fc7
regular5=c49bff
regular6=3cc7b8
regular7=c7d3d4
bright0=4e5e62
bright1=ff8f84
bright2=9ee6b3
bright3=ffc24d
bright4=8cc4ff
bright5=d9beff
bright6=2ee6d6
bright7=ffffff

[colors-light]
alpha=0.92
background=f2f7f8
foreground=0b1a1d
selection-foreground=0b1a1d
selection-background=9ed9e3
urls=0a8fa6
cursor=f2f7f8 0b1a1d
regular0=0b1a1d
regular1=c62828
regular2=1e8e3e
regular3=b86f00
regular4=1a5fb4
regular5=7b3fb0
regular6=0a8fa6
regular7=475c61
bright0=475c61
bright1=e53935
bright2=2e9e4e
bright3=c77d0a
bright4=2a7fd4
bright5=9358c8
bright6=0e9bb0
