# Axiom Terminal — system default configuration for foot.
#
# Users override any of this in ~/.config/foot/foot.ini. Palette and type
# follow docs/DESKTOP_DESIGN.md (branding/theme/axiom/colors.toml).

[main]
font=JetBrains Mono:size=11.5
font-bold=JetBrains Mono:weight=bold:size=11.5
font-italic=JetBrains Mono:slant=italic:size=11.5
line-height=17px
pad=18x14 center
# Let the compositor's percentage size win exactly; padding absorbs the
# remainder instead of the window snapping to whole cells.
resize-by-cells=no
title=Axiom Terminal
locked-title=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[colors-dark]
# Near-black graphite, slightly translucent. No blur in the harness, so keep
# opacity high for readability.
alpha=0.94
background=0a0d0f
foreground=edf5f5
selection-foreground=edf5f5
selection-background=126e70
urls=37f0ea
cursor=0a0d0f 37f0ea
#        black  red    green  yellow blue   magenta cyan   white
regular0=11191d
regular1=f2685e
regular2=7fd99a
regular3=ffb348
regular4=5aa9ff
regular5=c49bff
regular6=20d6d2
regular7=c7d3d4
bright0=4e5e62
bright1=ff8f84
bright2=9ee6b3
bright3=ffc978
bright4=8cc4ff
bright5=d9beff
bright6=37f0ea
bright7=edf5f5

[csd]
# Axiom Terminal uses the compositor's server-side title bar (labwc, Axiom
# theme): app icon, "Axiom Terminal", and working minimize / maximize / close.
preferred=server
